name: Keep Streamlit Alive

on:
  schedule:
    # Streamlit Cloud'un mevcut hareketsizlik eşiği ~12 saat.
    # Bunu güvenle geçmemek için her 6 saatte bir çalıştırıyoruz.
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # Manuel tetikleme için

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Uygulamayı uyandır
        env:
          STREAMLIT_APP_URL: "https://sigarafark.streamlit.app/"
        run: python keepalive/wake_app.py
