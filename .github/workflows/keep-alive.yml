name: Keep Streamlit Alive

on:
  schedule:
    - cron: "0 */2 * * *"  # Her 2 saatte bir
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to Streamlit app
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://sigarafark.streamlit.app/'
          method: 'GET'
          timeout: 30000  # Zaman aşımını 30 saniyeye çıkararak uyanma süresine tanınan payı artırın
